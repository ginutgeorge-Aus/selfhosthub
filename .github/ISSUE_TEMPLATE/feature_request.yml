name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What are you trying to do that SelfHostHub doesn't support today?
      placeholder: As a parent, I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Rough is fine.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup wizard / preflight
        - Turning on virtualization (BIOS)
        - Installing an app
        - App catalog (new app request)
        - Opening apps from other devices
        - HTTPS / DuckDNS / deSEC
        - Updates
        - Other
    validations:
      required: true
